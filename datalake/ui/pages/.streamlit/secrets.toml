# Local secrets for `streamlit run` from datalake/ui/pages/ (see ingest.sh).
# Prefer exporting MINIO_URI / API_BASE_URL from ingest.sh — env vars override these.

# PostGIS (only needed if a page talks to DB directly)
DATABASE_URL = "postgresql://datalake:datalake@localhost:35432/datalake"

# FastAPI warehouse backend
API_BASE_URL = "http://130.192.238.11:8008"

# MinIO object storage — bucket must already exist (e.g. datawh)
[minio]
endpoint   = "localhost:9000"
access_key = "minioadmin"
secret_key = "minioadmin"
bucket     = "datawh"
secure     = false
