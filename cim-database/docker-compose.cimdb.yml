# CIM Wizard Database - PostgreSQL 15 + PostGIS + TimescaleDB
# Initializes from init-db/ scripts on first startup

services:
  cim-database:
    build:
      context: .
      dockerfile: Dockerfile
    image: cim-database:latest
    container_name: cim-integrateddb
    restart: unless-stopped

    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]

    ports:
      - "15432:5432"

    environment:
      POSTGRES_DB: cim_wizard_integrated
      POSTGRES_USER: cim_wizard_user
      POSTGRES_PASSWORD: cim_wizard_password
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      # Persistent database storage
      - cim_postgres_data:/var/lib/postgresql/data

      # Init backup - runs automatically on first startup
      # Place init_backup.sql (plain SQL from pg_dump -F p) in init-db/
      - ./init-db:/docker-entrypoint-initdb.d:ro

      # Backup directory for create_backup.sh
      - ./backups:/backups

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  cim_postgres_data:
    driver: local
