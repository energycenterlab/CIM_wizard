# Standby clone on cloud4. Same image as cloud3.
# NO init-db mount: first start is an empty PostGIS/Timescale cluster.
# Load data with snapshot-c3-to-c4.sh, not init_backup.sql.

services:
  cim-database:
    build:
      context: .
      dockerfile: Dockerfile
    image: cim-database:latest
    container_name: cim-integrateddb
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: cim_wizard_integrated
      POSTGRES_USER: cim_wizard_user
      POSTGRES_PASSWORD: cim_wizard_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - cim_postgres_replica_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  cim_postgres_replica_data: