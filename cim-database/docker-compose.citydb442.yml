# 3DCityDB 4.4.2, empty citydb schema. No ADE SQL at init.
# Register Energy ADE 3.0 beta 7 once with Importer/Exporter ADE Manager.
# Do not also Register energy-ade-2.1.0 (ADE 1) on this database.
#
# Start: docker compose -f docker-compose.citydb442.yml up -d
# Connect: host <server>, port 75432, db citydb, user/pass below.
# Alderaan is EPSG:28992. Importer/Exporter does not transform on Import.

name: citydb442

services:
  citydb:
    image: 3dcitydb/3dcitydb-pg:4.4.2
    container_name: citydb-442-energyade3
    restart: unless-stopped
    ports:
      - "25432:5432"
    environment:
      POSTGRES_DB: citydb
      POSTGRES_USER: cim_wizard_user
      POSTGRES_PASSWORD: cim_wizard_password
      SRID: "28992"
      SRS_NAME: "urn:ogc:def:crs:EPSG::28992"
      GMLSRSNAME: "urn:ogc:def:crs:EPSG::28992"
    volumes:
      - citydb_442_ade3_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cim_wizard_user -d citydb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  citydb_442_ade3_data:
    driver: local
