# =============================================================
#  Ontop JDBC connection properties
#  Used by: Ontop Protege plugin / Ontop CLI
#
#  Remote DB:  cim-integrateddb on eclab-cloud3 (130.192.238.11)
#  Host port:  15432 → container port 5432
# =============================================================

jdbc.url      = jdbc:postgresql://130.192.238.11:15432/cim_wizard_integrated
jdbc.driver   = org.postgresql.Driver
jdbc.user     = cim_wizard_user
jdbc.password = cim_wizard_password

# Optional label shown in Ontop's datasource panel
jdbc.name = cim-citydb

# =============================================================
#  Ontop reasoning / query rewriting options
# =============================================================

# Disable full OWL 2 reasoning – use T-Box only for query rewriting
# (recommended for large CityGML datasets)
ontop.enableEquivalences    = true
ontop.enableExistentialReasoning = true

# PostgreSQL-specific: keep schema search path so unqualified
# table names in SQL queries resolve correctly if needed
# ontop.defaultSchema = citydb
