# CIM Wizard Integrated - Backend + Database
# Run from this directory. Requires ../cim-database/ with init_backup.sql for first-time DB init.

services:
  db:
    build:
      context: ../cim-database
      dockerfile: Dockerfile
    image: cim-database:latest
    container_name: cim-integrateddb
    restart: unless-stopped

    ports:
      - "15432:5432"

    environment:
      POSTGRES_DB: cim_wizard_integrated
      POSTGRES_USER: cim_wizard_user
      POSTGRES_PASSWORD: cim_wizard_password
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - cim_postgres_data:/var/lib/postgresql/data
      - ../cim-database/init-db:/docker-entrypoint-initdb.d:ro
      - ../cim-database/backups:/backups

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

    deploy:
      resources:
        limits:
          memory: 4G

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cim-backend:latest
    container_name: cim-backend
    restart: unless-stopped

    ports:
      - "8001:8001"

    environment:
      DATABASE_URL: postgresql://cim_wizard_user:cim_wizard_password@db:5432/cim_wizard_integrated
      CELERY_BROKER_URL: redis://cim-redis:6379/0
      CELERY_RESULT_BACKEND: redis://cim-redis:6379/1

    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "4"]

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: cim-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cim_redis_data:/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cim-backend:latest
    container_name: cim-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app:celery", "worker", "-Q", "heavy", "-c", "1", "-l", "info"]
    environment:
      DATABASE_URL: postgresql://cim_wizard_user:cim_wizard_password@db:5432/cim_wizard_integrated
      CELERY_BROKER_URL: redis://cim-redis:6379/0
      CELERY_RESULT_BACKEND: redis://cim-redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started

volumes:
  cim_postgres_data:
    driver: local
  cim_redis_data:
    driver: local
